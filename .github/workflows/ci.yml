name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Tests need no secrets: tests/setup.ts pins dummy credentials and the
      # LLM is served by tests/mocks/mock-llm.ts.
      - run: npm test -- --coverage
      # Exercises evals/run.ts end to end against the same mock server, so the
      # harness cannot rot between manual runs. No credentials, no spend.
      - run: npm run evals:mock
      - run: npm run build
      - run: npm run audit
