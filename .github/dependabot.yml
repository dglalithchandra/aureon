version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next-runtime:
        patterns:
          - next
          - eslint-config-next
      test-tooling:
        dependency-type: development
        patterns:
          - vitest
          - "@vitest/*"
          - "@playwright/*"
    versioning-strategy: increase-if-necessary

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
